[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "falcon-shield-alerts"
version = "0.1.0"
description = "Poll Falcon Shield check status and post transitions to one Slack channel."
requires-python = ">=3.12"
dependencies = ["httpx"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
falcon-shield-alerts = "falcon_shield_alerts.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
